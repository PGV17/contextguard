name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + type-check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app scripts alembic

      - name: Type-check (mypy)
        run: mypy app

      - name: Unit tests (no database required)
        run: pytest -q

  migration-smoke:
    name: migration + schema smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CG_DATABASE_URL: postgresql+asyncpg://postgres:password@127.0.0.1:5432/rag_db
      CG_EMBEDDING_PROVIDER: local
      CG_EMBEDDING_DIMENSIONS: "384"
      CG_LLM_PROVIDER: extractive
      CG_SECRET_KEY: ci-secret-key-0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify schema (vector dims, HNSW, tsvector, users, audit chain)
        run: python -m scripts.check_schema
